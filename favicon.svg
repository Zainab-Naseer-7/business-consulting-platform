<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1224" />
      <stop offset="60%" stop-color="#2D0A16" />
      <stop offset="100%" stop-color="#14040A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E2A4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997722" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer luxury shield -->
  <rect width="64" height="64" rx="16" fill="url(#burgundyGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  <rect x="5" y="5" width="54" height="54" rx="11" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="2 3" stroke-opacity="0.4" />
  
  <!-- Stylized Monogram Crest: V & S (Vanguard & Sterling) and Growth Arrow -->
  <!-- V Chevron -->
  <path d="M19 20L32 44L45 20" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />
  <!-- Sterling Central Diamond Pillar -->
  <polygon points="32,14 36,22 32,30 28,22" fill="url(#goldGrad)" />
  <circle cx="32" cy="14" r="2.5" fill="#FFFDF8" />
  <!-- Ascending Strategic Vector Bar -->
  <path d="M25 31L32 23L39 31" stroke="#F7E2A4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="32" cy="44" r="2" fill="#D4AF37" />
</svg>
